server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # CORS is handled once, at the edge, instead of in every service.
      globalcors:
        cors-configurations:
          "[/**]":
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**,/api/employees/**
        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/api/requests/**
        - id: reward-point-service
          uri: lb://rewardPoint-service
          predicates:
            - Path=/api/points/**,/api/activities/**
        # Proxy to the Vouchery API so its key stays on the server instead of in the JS bundle.
        - id: vouchery
          uri: ${VOUCHERY_BASE_URL:https://university-of-science.sandbox.vouchery.app}
          predicates:
            - Path=/api/vouchery/**
          filters:
            - RewritePath=/api/vouchery/?(?<segment>.*), /api/v2.1/$\{segment}
            - SetRequestHeader=Authorization, Bearer ${VOUCHERY_API_KEY:}
    # Pick up newly registered instances quickly (default cache TTL is 35s).
    loadbalancer:
      cache:
        ttl: 5s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

# Must match the secret user-service signs tokens with (at least 32 bytes).
jwt:
  secret: ${JWT_SECRET:change-me-dev-only-jwt-secret-at-least-32-bytes}
