spring.application.name=rewardPoint-service
server.port=8084

# Service discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# MongoDB (creates the unique index on points.uid at startup)
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.authentication-database=${MONGO_AUTH_DB:admin}
spring.data.mongodb.username=${MONGO_USERNAME:mongo}
spring.data.mongodb.password=${MONGO_PASSWORD:mongo}
spring.data.mongodb.database=${MONGO_DATABASE:RewardPointDB}
spring.data.mongodb.auto-index-creation=true

# RabbitMQ: retry a failing message 3 times, then drop it instead of redelivering forever
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Vouchery (optional): registers new employees as voucher customers
vouchery.api.url=${VOUCHERY_API_URL:https://university-of-science.sandbox.vouchery.app/api/v2.1/customers}
vouchery.api.key=${VOUCHERY_API_KEY:}

# Strava (optional): OAuth token exchange for the Activities page; the secret stays server-side
strava.client-id=${STRAVA_CLIENT_ID:}
strava.client-secret=${STRAVA_CLIENT_SECRET:}
strava.token-url=https://www.strava.com/oauth/token
