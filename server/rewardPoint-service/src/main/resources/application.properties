spring.application.name=rewardPoint-service
server.port=8084
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# MongoDB Configuration
spring.data.mongodb.authentication-database=${MONGO_AUTH_DB:admin}
spring.data.mongodb.username=${MONGO_USERNAME:mongo}
spring.data.mongodb.password=${MONGO_PASSWORD:mongo}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.database=${MONGO_DATABASE:RewardPointDB}

# Vouchery API (externalized — override in production)
vouchery.api.url=${VOUCHERY_API_URL:https://university-of-science.sandbox.vouchery.app/api/v2.1/customers}
vouchery.api.key=${VOUCHERY_API_KEY:}
