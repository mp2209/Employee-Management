spring.application.name=user-service
server.port=8081

# Service discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# MySQL (the database is created on first start if it does not exist)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ProfileService?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Avatars are stored as Base64 in MySQL, so keep uploads small
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# JWT: the api-gateway verifies tokens with the same secret (at least 32 bytes)
jwt.secret=${JWT_SECRET:change-me-dev-only-jwt-secret-at-least-32-bytes}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# Creates admin/admin123 (Manager) and employee/employee123 (Employee) on first start
app.demo-data.enabled=${SEED_DEMO_DATA:true}
