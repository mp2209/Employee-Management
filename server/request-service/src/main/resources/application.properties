spring.application.name=request-service
server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# MongoDB Configuration (override in production with env vars)
spring.data.mongodb.authentication-database=${MONGO_AUTH_DB:admin}
spring.data.mongodb.username=${MONGO_USERNAME:mongo}
spring.data.mongodb.password=${MONGO_PASSWORD:mongo}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.database=${MONGO_DATABASE:RequestDB}
